<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>AVID Check Wheel | Mr. Rogers’ Homebase</title>
  <style>
    :root{--navy:#17365d;--navy-deep:#102946;--gold:#e3ad35;--red:#bb2649;--ink:#172638;--muted:#53667c;--paper:#fff;--canvas:#f4f7fb;--line:#d8e1ec;--green:#176b4d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font:18px/1.5 Arial,Helvetica,sans-serif}
    main{max-width:1080px;margin:0 auto;padding:clamp(20px,5vw,54px) 18px 48px;text-align:center}
    .home-link{display:inline-block;margin-bottom:18px;color:var(--navy);font-size:15px;font-weight:700;text-decoration-thickness:2px;text-underline-offset:4px}
    h1{margin:0;color:var(--navy);font-size:clamp(30px,5vw,48px);font-weight:900;letter-spacing:.02em;line-height:1.1}
    .intro{margin:10px auto 0;max-width:650px;color:var(--muted);font-size:clamp(16px,2.3vw,20px)}
    .wheel-stage{position:relative;width:min(80vw,490px);aspect-ratio:1;margin:24px auto 28px}
    .pointer{position:absolute;z-index:3;left:50%;top:-15px;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:42px solid var(--red);filter:drop-shadow(0 3px 2px #0004)}
    .wheel{position:absolute;inset:0;border:11px solid var(--paper);border-radius:50%;background:conic-gradient(#e8f2ff 0deg 88deg,#fff 88deg 92deg,#b9e3d0 92deg 178deg,#fff 178deg 182deg,#f7d4dd 182deg 268deg,#fff 268deg 272deg,#f4c65c 272deg 358deg,#fff 358deg 360deg);box-shadow:0 0 0 4px var(--navy),0 14px 30px #10294625;transition:transform 4.4s cubic-bezier(.12,.72,.12,1)}
    .wheel-label{position:absolute;width:42%;color:var(--navy);font-size:clamp(15px,2.2vw,21px);font-weight:900;line-height:1.1}
    .wheel-label span{display:block;margin-bottom:7px;font-size:clamp(30px,5.4vw,52px)}
    .wheel-label.backpack{top:14%;left:5%}.wheel-label.binder{top:14%;right:5%}.wheel-label.chromebook{right:5%;bottom:13%}.wheel-label.planner{bottom:13%;left:5%}
    .hub{position:absolute;z-index:2;top:50%;left:50%;display:grid;width:25%;aspect-ratio:1;place-items:center;transform:translate(-50%,-50%);border:6px solid var(--navy);border-radius:50%;background:var(--paper);color:var(--navy);font-size:clamp(14px,2vw,18px);font-weight:900}
    button{min-height:64px;padding:16px 34px;border:0;border-radius:999px;background:var(--red);box-shadow:0 5px 0 #811a33;color:#fff;font:900 21px/1 Arial,Helvetica,sans-serif;cursor:pointer}
    button:hover{background:#a61e3f;transform:translateY(-1px)}button:disabled{background:#7d8792;box-shadow:none;cursor:wait;transform:none}
    button:focus-visible,a:focus-visible{outline:4px solid #2671ad;outline-offset:4px}
    .result{max-width:820px;margin:28px auto 0;padding:clamp(18px,3.5vw,32px);border:2px solid #f0cf75;border-radius:18px;background:#fff9e9;text-align:left}
    .result[hidden]{display:none}
    .result-main{display:grid;grid-template-columns:190px minmax(0,1fr);gap:26px;align-items:center}
    .art{display:grid;min-height:175px;place-items:center;border-radius:14px;background:#fff}.art svg{width:148px;height:148px}
    .label{margin:0 0 5px;color:var(--muted);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h2{margin:0 0 8px;color:var(--navy);font-size:clamp(28px,4vw,40px);line-height:1.1}
    .directions{margin:0;font-size:clamp(19px,2.5vw,23px)}
    .partner{margin:20px 0 0;padding-top:16px;border-top:1px solid #e7d9b1;color:var(--navy);font-size:17px;font-weight:750}
    .signal{margin:14px 0 0;padding:14px 16px;border-radius:10px;background:#fff;text-align:center;font-size:17px}
    @media(max-width:620px){main{padding-top:20px}.wheel-stage{width:min(86vw,390px);margin-top:28px}.wheel-label{font-size:clamp(12px,3.2vw,17px)}.result-main{grid-template-columns:1fr;text-align:center;gap:16px}.art{min-height:140px}.art svg{width:125px;height:125px}.result{text-align:center;padding:18px}.partner{font-size:16px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <a class="home-link" href="../">← Homebase</a>
    <h1>AVID CLASS CHECK</h1>
    <p class="intro">Spin the wheel to choose today’s whole-class check. Have a partner confirm your check.</p>
    <div class="wheel-stage" aria-label="Wheel with four class checks">
      <div class="pointer" aria-hidden="true"></div>
      <div class="wheel" id="wheel" aria-hidden="true">
        <div class="wheel-label backpack"><span>🎒</span>BACKPACK</div>
        <div class="wheel-label binder"><span>📚</span>BINDER</div>
        <div class="wheel-label chromebook"><span>💻</span>CHROMEBOOK</div>
        <div class="wheel-label planner"><span>📅</span>PLANNER</div>
      </div>
      <div class="hub" aria-hidden="true">AVID</div>
    </div>
    <button id="spin" type="button">🎡 SPIN THE WHEEL</button>
    <section id="result" class="result" aria-live="polite" aria-atomic="true" hidden>
      <div class="result-main">
        <div class="art" id="art" aria-hidden="true"></div>
        <div><p class="label">Today’s check</p><h2 id="task"></h2><p class="directions" id="directions"></p></div>
      </div>
      <p class="partner" id="partner"></p>
      <p class="signal">👍 <strong>Thumbs up:</strong> Met expectations &nbsp;·&nbsp; <strong>No thumbs up:</strong> Needs follow-up</p>
    </section>
  </main>
  <script>
    const tasks=[
      {name:'BACKPACK DUMP',directions:'Take your binder out of your backpack. Dump everything else from your backpack onto your table.',partner:'Partner check: Look for loose items, papers, trash, or anything that should not be in the backpack. Then repack neatly.',angle:315,art:'<svg viewBox="0 0 160 160"><path d="M48 45a32 32 0 0 1 64 0h12a12 12 0 0 1 12 12v75a12 12 0 0 1-12 12H36a12 12 0 0 1-12-12V57a12 12 0 0 1 12-12h12Z" fill="#e7f1ff" stroke="#17365d" stroke-width="7"/><path d="M49 46a31 31 0 0 1 62 0M40 73h80v48H40z" fill="#f4c65c" stroke="#17365d" stroke-width="7"/><path d="M58 96h44M70 73v48" stroke="#17365d" stroke-width="7" stroke-linecap="round"/></svg>'},
      {name:'BINDER SHAKE',directions:'Hold your binder up and gently shake it. Nothing should fall out.',partner:'Partner check: Watch your classmate give the binder a gentle shake. If anything falls out, put it into the correct section.',angle:45,art:'<svg viewBox="0 0 160 160"><path d="M40 24h82a12 12 0 0 1 12 12v98H40a12 12 0 0 1-12-12V36a12 12 0 0 1 12-12Z" fill="#fff4d6" stroke="#17365d" stroke-width="7"/><path d="M49 24v110M60 52h52M60 72h42M60 92h48" stroke="#17365d" stroke-width="7" stroke-linecap="round"/><circle cx="40" cy="50" r="4" fill="#bb2649"/><circle cx="40" cy="78" r="4" fill="#bb2649"/><circle cx="40" cy="106" r="4" fill="#bb2649"/></svg>'},
      {name:'CHROMEBOOK CHARGE',directions:'Check your Chromebook battery. It should be charged above 50%.',partner:'Partner check: Have your classmate show the battery level on the screen. If it is at or below 50%, make a plan to charge it.',angle:135,art:'<svg viewBox="0 0 160 160"><rect x="34" y="28" width="92" height="82" rx="8" fill="#e7f1ff" stroke="#17365d" stroke-width="7"/><path d="M20 121h120l-10 13H30l-10-13Z" fill="#f4c65c" stroke="#17365d" stroke-width="7"/><text x="80" y="78" text-anchor="middle" font-family="Arial" font-weight="900" font-size="22" fill="#17365d">50%</text></svg>'},
      {name:'PLANNER CHECK',directions:'Show Mr. Rogers your planner.',partner:'Partner check: Make sure your planner is with you and ready to use. You are not being checked on whether another teacher posted an agenda.',angle:225,art:'<svg viewBox="0 0 160 160"><rect x="28" y="34" width="104" height="100" rx="12" fill="#f7d4dd" stroke="#17365d" stroke-width="7"/><path d="M28 61h104M54 25v20m52-20v20" stroke="#17365d" stroke-width="8" stroke-linecap="round"/><path d="m51 88 10 10 19-21m7 18h22m-57 18h57" fill="none" stroke="#176b4d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
    ];
    const wheel=document.getElementById('wheel'),button=document.getElementById('spin'),result=document.getElementById('result');let rotation=0;
    button.addEventListener('click',()=>{
      button.disabled=true;button.textContent='🎡 SPINNING…';result.hidden=true;
      const task=tasks[Math.floor(Math.random()*tasks.length)],turns=5+Math.floor(Math.random()*3);
      rotation+=turns*360+(360-task.angle);wheel.style.transform=`rotate(${rotation}deg)`;
      window.setTimeout(()=>{document.getElementById('art').innerHTML=task.art;document.getElementById('task').textContent=task.name;document.getElementById('directions').textContent=task.directions;document.getElementById('partner').textContent=task.partner;result.hidden=false;result.scrollIntoView({behavior:'smooth',block:'center'});button.disabled=false;button.textContent='🎡 SPIN AGAIN'},4500);
    });
  </script>
</body>
</html>
